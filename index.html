<script>
        // ===== تولید برف =====
        (function createSnow() {
            const container = document.getElementById('snowflakes');
            const flakes = ['❄', '❅', '❆', '✦'];
            for (let i = 0; i < 45; i++) {
                const el = document.createElement('div');
                el.className = 'snowflake';
                el.textContent = flakes[Math.floor(Math.random() * flakes.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.fontSize = (12 + Math.random() * 18) + 'px';
                el.style.animationDuration = (12 + Math.random() * 18) + 's';
                el.style.animationDelay = (Math.random() * 20) + 's';
                el.style.opacity = 0.3 + Math.random() * 0.5;
                container.appendChild(el);
            }
        })();

        // ==========================================================
        //  تشخیص ویندوز 10/11 و کامپیوتر
        // ==========================================================
        function isWindowsDesktop() {
            const ua = navigator.userAgent;
            const isWindows = /Windows NT (10\.0|10\.1)/i.test(ua);
            const isDesktop = !/Mobi|Android|iPhone|iPad|iPod|Tablet/i.test(ua);
            return isWindows && isDesktop;
        }

        // ==========================================================
        //  راه‌اندازی دکمه شروع با کلید E
        // ==========================================================
        function setupStartButton() {
            const startBtn = document.getElementById('startBtn');
            const keyHint = document.getElementById('keyHint');

            if (isWindowsDesktop()) {
                startBtn.classList.add('windows-mode');
                keyHint.classList.add('show');
                startBtn.addEventListener('click', function(e) { e.preventDefault(); });
                document.addEventListener('keydown', function(e) {
                    const homePage = document.getElementById('homePage');
                    if (homePage && homePage.style.display !== 'none' && e.key === 'E' && !e.ctrlKey && !e.altKey && !e
                        .metaKey) {
                        e.preventDefault();
                        goToMenu();
                    }
                });
                startBtn.title = 'برای شروع کلید E را بزنید';
            } else {
                startBtn.classList.remove('windows-mode');
                keyHint.classList.remove('show');
                startBtn.addEventListener('click', goToMenu);
            }
        }

        // ==========================================================
        //  تشخیص دستگاه
        // ==========================================================
        function detectDevice() {
            const ua = navigator.userAgent;
            let device = 'کامپیوتر';
            let icon = '💻';
            const width = window.innerWidth;

            if (/Mobi|Android|iPhone|iPad|iPod/i.test(ua)) {
                if (width < 768) { device = 'گوشی';
                    icon = '📱'; } else if (width < 1024) { device = 'تبلت';
                    icon = '📟'; } else { device = 'تبلت';
                    icon = '📟'; }
            } else {
                if (width < 768) { device = 'گوشی';
                    icon = '📱'; } else if (width < 1024) { device = 'تبلت';
                    icon = '📟'; } else {
                    if (isWindowsDesktop()) { device = 'ویندوز';
                        icon = '🪟'; } else { device = 'کامپیوتر';
                        icon = '💻'; }
                }
            }
            document.getElementById('deviceIcon').textContent = icon;
            document.getElementById('deviceName').textContent = device;
        }

        // ==========================================================
        //  سیستم سکه
        // ==========================================================
        function getUsersData() {
            try { const data = localStorage.getItem('usersData'); return data ? JSON.parse(data) : {}; } catch { return {}; }
        }

        function setUsersData(users) {
            localStorage.setItem('usersData', JSON.stringify(users));
        }

        function getUserCoins(username) {
            const users = getUsersData();
            return users[username] ? users[username].coins || 0 : 0;
        }

        function setUserCoins(username, amount) {
            const users = getUsersData();
            if (users[username]) {
                users[username].coins = Math.max(0, amount);
                setUsersData(users);
                updateCoinDisplay();
            }
        }

        function addUserCoins(username, amount) {
            const current = getUserCoins(username);
            setUserCoins(username, current + amount);
        }

        function removeUserCoins(username, amount) {
            const current = getUserCoins(username);
            if (current < amount) return false;
            setUserCoins(username, current - amount);
            return true;
        }

        function updateCoinDisplay() {
            const username = document.getElementById('displayUsername').textContent.trim();
            const coins = getUserCoins(username);
            document.getElementById('coinCount').textContent = coins;
            const profileCoins = document.getElementById('profileCoins');
            if (profileCoins) profileCoins.textContent = coins;
        }

        // ==========================================================
        //  سیستم جام‌ها
        // ==========================================================
        function getTrophies(username) {
            const users = getUsersData();
            return users[username] ? users[username].trophies || 0 : 0;
        }

        function setTrophies(username, count) {
            const users = getUsersData();
            if (users[username]) {
                users[username].trophies = count;
                setUsersData(users);
                updateTrophyDisplay();
            }
        }

        function getCurrentWinStreak(username) {
            const users = getUsersData();
            return users[username] ? users[username].winStreak || 0 : 0;
        }

        function setWinStreak(username, streak) {
            const users = getUsersData();
            if (users[username]) {
                users[username].winStreak = streak;
                setUsersData(users);
            }
        }

        function resetWinStreak(username) {
            setWinStreak(username, 0);
        }

        // ==========================================================
        //  سیستم اکانت ویژه
        // ==========================================================
        function isSpecialAccount(username) {
            const users = getUsersData();
            return users[username] ? users[username].specialAccount || false : false;
        }

        function setSpecialAccount(username, active) {
            const users = getUsersData();
            if (users[username]) {
                users[username].specialAccount = active;
                setUsersData(users);
                updateSpecialUI(username);
                updateTrophyDisplay();
            }
        }

        // ==========================================================
        //  تشخیص هد ادمین (جام ۴ یا اکانت ویژه)
        // ==========================================================
        function isHeadAdmin(username) {
            return getTrophies(username) >= 4 || isSpecialAccount(username);
        }

        // ==========================================================
        //  به‌روزرسانی نمایش جام و دکمه هد ادمین
        // ==========================================================
        function updateTrophyDisplay() {
            const username = document.getElementById('displayUsername').textContent.trim();
            const trophies = getTrophies(username);
            const trophyDisplay = document.getElementById('trophyDisplay');
            const trophyCount = document.getElementById('trophyCount');
            const profileTrophies = document.getElementById('profileTrophies');
            const headBtn = document.getElementById('headAdminBtn');

            if (trophyDisplay) {
                if (trophies > 0) {
                    trophyDisplay.style.display = 'inline-flex';
                    trophyCount.textContent = trophies;
                } else {
                    trophyDisplay.style.display = 'none';
                }
            }
            if (profileTrophies) profileTrophies.textContent = trophies;

            if (isHeadAdmin(username)) {
                headBtn.style.display = 'inline-block';
                const rankName = document.getElementById('headAdminRankName');
                if (rankName) rankName.textContent = username;
            } else {
                headBtn.style.display = 'none';
            }
        }

        // ==========================================================
        //  سیستم بن ۴۸ ساعته
        // ==========================================================
        const BAN_DURATION = 48 * 60 * 60 * 1000;

        function banUser(username) {
            const banned = getBannedUsers();
            banned[username] = Date.now();
            setBannedUsers(banned);
            return true;
        }

        function isUserBanned(username) {
            const banned = getBannedUsers();
            if (banned[username]) {
                const elapsed = Date.now() - banned[username];
                if (elapsed < BAN_DURATION) {
                    return true;
                } else {
                    delete banned[username];
                    setBannedUsers(banned);
                    return false;
                }
            }
            return false;
        }

        function getBanRemainingTime(username) {
            const banned = getBannedUsers();
            if (banned[username]) {
                const elapsed = Date.now() - banned[username];
                const remaining = BAN_DURATION - elapsed;
                if (remaining > 0) {
                    const hours = Math.floor(remaining / (60 * 60 * 1000));
                    const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
                    const seconds = Math.floor((remaining % (60 * 1000)) / 1000);
                    return `${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
                }
                return '00:00:00';
            }
            return null;
        }

        function updateBanTimer() {
            const username = document.getElementById('displayUsername').textContent.trim();
            if (!username) return;
            const remaining = getBanRemainingTime(username);
            const timerEl = document.getElementById('banTimer');
            if (remaining) {
                timerEl.textContent = remaining;
                setTimeout(updateBanTimer, 1000);
            } else {
                timerEl.textContent = '✅ زمان بن تمام شد!';
                if (document.getElementById('bannedPage').style.display === 'flex') {
                    location.reload();
                }
            }
        }

        // ==========================================================
        //  بن کردن کاربر "kia"
        // ==========================================================
        (function banKiaUser() {
            const users = getUsersData();
            for (const username of Object.keys(users)) {
                if (username.toLowerCase() === 'kia') {
                    if (!isUserBanned(username)) {
                        banUser(username);
                        console.log(`✅ کاربر "${username}" به مدت ۴۸ ساعت بن شد.`);
                    }
                    break;
                }
            }
        })();

        // ==========================================================
        //  عملکرد ویژه اکانت ویژه
        // ==========================================================
        function updateSpecialUI(username) {
            const isSpecial = isSpecialAccount(username);
            const nameEl = document.getElementById('displayUsername');
            if (isSpecial) {
                nameEl.style.color = '#ffd700';
                nameEl.style.textShadow = '0 0 20px rgba(255,215,0,0.3)';
                const avatarPreview = document.getElementById('avatarPreview');
                if (avatarPreview) {
                    avatarPreview.style.border = '3px solid #ffd700';
                    avatarPreview.style.boxShadow = '0 0 40px rgba(255,215,0,0.2)';
                }
                const headerAvatar = document.getElementById('headerAvatar');
                if (headerAvatar) {
                    headerAvatar.style.border = '2px solid #ffd700';
                }
            } else {
                nameEl.style.color = '';
                nameEl.style.textShadow = '';
                const avatarPreview = document.getElementById('avatarPreview');
                if (avatarPreview) {
                    avatarPreview.style.border = '3px solid rgba(255,255,255,0.1)';
                    avatarPreview.style.boxShadow = '0 0 40px rgba(79,172,254,0.1)';
                }
                const headerAvatar = document.getElementById('headerAvatar');
                if (headerAvatar) {
                    headerAvatar.style.border = '2px solid rgba(255,255,255,0.15)';
                }
            }
        }

        // ==========================================================
        //  خرید اکانت ویژه
        // ==========================================================
        function buySpecialAccount() {
            const username = document.getElementById('displayUsername').textContent.trim();
            if (!username) {
                alert('⚠️ لطفاً ابتدا وارد اکانت خود شوید.');
                return;
            }

            if (isSpecialAccount(username)) {
                alert('✅ شما قبلاً اکانت ویژه دارید!');
                return;
            }

            const coins = getUserCoins(username);
            if (coins < 5000) {
                alert('❌ سکه کافی نیست! شما به ۵,۰۰۰ سکه نیاز دارید.');
                return;
            }

            if (confirm('🌟 آیا مطمئن هستید که ۵,۰۰۰ سکه برای خرید اکانت ویژه خرج کنید؟\n\n✨ روزی ۲۰ سکه\n✨ نام طلایی\n✨ رنک هد ادمین\n✨ قاب پروفایل اختصاصی\n✨ رنگ نام دلخواه')) {
                if (removeUserCoins(username, 5000)) {
                    setSpecialAccount(username, true);
                    alert('✅ تبریک! اکانت ویژه برای شما فعال شد.');
                    updateStoreUI();
                    updateCoinDisplay();
                    updateSpecialUI(username);
                    updateTrophyDisplay();
                } else {
                    alert('❌ خطا در کاهش سکه.');
                }
            }
        }

        // ==========================================================
        //  سیستم کدهای هدیه
        // ==========================================================
        const USED_GIFT_CODES_KEY = 'usedGiftCodes';

        function getUsedGiftCodes() {
            try { const data = localStorage.getItem(USED_GIFT_CODES_KEY); return data ? JSON.parse(data) : {}; } catch { return {}; }
        }

        function setUsedGiftCodes(used) {
            localStorage.setItem(USED_GIFT_CODES_KEY, JSON.stringify(used));
        }

        function addUsedGiftCode(username, code) {
            const used = getUsedGiftCodes();
            if (!used[username]) { used[username] = []; }
            if (!used[username].includes(code)) {
                used[username].push(code);
                setUsedGiftCodes(used);
                return true;
            }
            return false;
        }

        function hasUsedGiftCode(username, code) {
            const used = getUsedGiftCodes();
            return used[username] && used[username].includes(code);
        }

        // ==========================================================
        //  تابع بررسی کد هدیه
        // ==========================================================
        function checkGiftCode() {
            const input = document.getElementById('giftCodeInputUser');
            const code = input.value.trim();
            const result = document.getElementById('giftResult');
            const textEl = document.getElementById('giftResultText');
            const prizeEl = document.getElementById('giftResultPrize');
            const username = document.getElementById('displayUsername').textContent.trim();

            if (!username || username === 'کاربر' || username === '---') {
                result.className = 'gift-result error';
                result.style.display = 'block';
                textEl.textContent = '⚠️ لطفاً ابتدا وارد اکانت خود شوید.';
                prizeEl.textContent = '';
                return;
            }

            if (code === '877') {
                result.className = 'gift-result error';
                result.style.display = 'block';
                textEl.textContent = '❌ کد هدیه اشتباه است!';
                prizeEl.textContent = '';
                return;
            }

            if (code === '80') {
                const now = new Date();
                const hours = now.getHours();
                const minutes = now.getMinutes();
                const currentTime = hours * 60 + minutes;
                const expiryTime = 20 * 60 + 50;

                if (currentTime > expiryTime) {
                    result.className = 'gift-result error';
                    result.style.display = 'block';
                    textEl.textContent = '⏰ کد هدیه منقضی شده است!';
                    prizeEl.textContent = '🕐 این کد فقط تا ساعت ۲۰:۵۰ قابل استفاده است.';
                    return;
                }

                if (hasUsedGiftCode(username, '80')) {
                    result.className = 'gift-result error';
                    result.style.display = 'block';
                    textEl.textContent = '⚠️ کد هدیه را قبلاً استفاده کردید!';
                    prizeEl.textContent = '';
                    return;
                } else {
                    addUserCoins(username, 80);
                    addUsedGiftCode(username, '80');
                    updateCoinDisplay();
                    result.className = 'gift-result success';
                    result.style.display = 'block';
                    textEl.textContent = '🎉 کد هدیه با موفقیت اعمال شد!';
                    prizeEl.textContent = '🪙 +۸۰ سکه به حساب شما اضافه شد.';
                    return;
                }
            }

            if (code === 'برفی') {
                const now = new Date();
                const hours = now.getHours();
                const minutes = now.getMinutes();
                const currentTime = hours * 60 + minutes;
                const expiryTime = 12 * 60 + 30;

                if (currentTime > expiryTime) {
                    result.className = 'gift-result error';
                    result.style.display = 'block';
                    textEl.textContent = '⏰ کد هدیه منقضی شده است!';
                    prizeEl.textContent = '🕐 این کد فقط تا ساعت ۱۲:۳۰ قابل استفاده است.';
                    return;
                }

                if (hasUsedGiftCode(username, 'برفی')) {
                    result.className = 'gift-result error';
                    result.style.display = 'block';
                    textEl.textContent = '⚠️ کد هدیه را قبلاً استفاده کردید!';
                    prizeEl.textContent = '';
                    return;
                } else {
                    addUserCoins(username, 30);
                    addUsedGiftCode(username, 'برفی');
                    updateCoinDisplay();
                    result.className = 'gift-result success';
                    result.style.display = 'block';
                    textEl.textContent = '🎉 کد هدیه با موفقیت اعمال شد!';
                    prizeEl.textContent = '🪙 +۳۰ سکه به حساب شما اضافه شد.';
                    return;
                }
            }

            if (code === '1234') {
                addUserCoins(username, 100);
                updateCoinDisplay();
                result.className = 'gift-result success';
                result.style.display = 'block';
                textEl.textContent = '✅ کد هدیه درست است!';
                prizeEl.textContent = '🎁 جایزه شما: ۱۰۰ سکه طلا';
                return;
            }

            result.className = 'gift-result error';
            result.style.display = 'block';
            textEl.textContent = '❌ کد هدیه اشتباه است!';
            prizeEl.textContent = '';
        }

        // ==========================================================
        //  مدیریت نام‌های کاربری و بن
        // ==========================================================
        function getRegisteredUsernames() {
            try { const data = localStorage.getItem('registeredUsernames'); return data ? JSON.parse(data) : []; } catch { return []; }
        }

        function setRegisteredUsernames(list) { localStorage.setItem('registeredUsernames', JSON.stringify(list)); }

        function addUsername(username) {
            const list = getRegisteredUsernames();
            if (!list.includes(username)) { list.push(username);
                setRegisteredUsernames(list); }
        }

        function isUsernameTaken(username) { return getRegisteredUsernames().includes(username); }

        function getBannedUsers() {
            try { const data = localStorage.getItem('bannedUsers'); return data ? JSON.parse(data) : {}; } catch { return {}; }
        }

        function setBannedUsers(banned) { localStorage.setItem('bannedUsers', JSON.stringify(banned)); }

        function unbanUser(username) { const banned = getBannedUsers(); delete banned[username];
            setBannedUsers(banned); return true; }

        // ==========================================================
        //  تنظیم اولیه لیست مدیران
        // ==========================================================
        (function initAdmins() {
            const defaultAdmins = ["ابوالفضل", "محمد رضا", "آراد"];
            let admins = [];
            try {
                const stored = localStorage.getItem('admins');
                if (stored) {
                    admins = JSON.parse(stored);
                    defaultAdmins.forEach(u => { if (!admins.includes(u)) admins.push(u); });
                    localStorage.setItem('admins', JSON.stringify(admins));
                } else { localStorage.setItem('admins', JSON.stringify(defaultAdmins)); }
            } catch { localStorage.setItem('admins', JSON.stringify(defaultAdmins)); }
        })();

        function getAdmins() {
            try { const data = localStorage.getItem('admins'); return data ? JSON.parse(data) : ["ابوالفضل", "محمد رضا",
                    "آراد"]; } catch { return ["ابوالفضل", "محمد رضا", "آراد"]; }
        }

        function setAdmins(admins) { localStorage.setItem('admins', JSON.stringify(admins)); }

        function removeAdmin(adminToRemove) {
            const currentUser = document.getElementById('displayUsername').textContent.trim();
            if (currentUser !== "ابوالفضل" && !isTemporarySuperAdmin(currentUser) && !isHeadAdmin(currentUser)) {
                alert('⛔ فقط سوپر ادمین (دائم/موقت) یا هد ادمین می‌تواند ادمین‌ها را حذف کند!');
                return;
            }
            if (adminToRemove === "ابوالفضل") { alert('⛔ نمی‌توانید خودتان را حذف کنید!'); return; }
            let admins = getAdmins();
            admins = admins.filter(a => a !== adminToRemove);
            setAdmins(admins);
            updateAdminPanelUI();
            alert(`✅ ادمین "${adminToRemove}" حذف شد!`);
        }

        function updateAdminPanelUI() {
            const admins = getAdmins();
            const adminListEl = document.getElementById('adminNamesDisplay');
            if (!adminListEl) return;
            const currentUser = document.getElementById('displayUsername').textContent.trim();
            const isSuperAdmin = currentUser === "ابوالفضل" || isTemporarySuperAdmin(currentUser) || isHeadAdmin(currentUser);
            let html = '';
            admins.forEach(admin => {
                let color = '#fff';
                if (admin === "آراد") color = '#f1c40f';
                if (admin === "ابوالفضل") color = '#ff6b6b';
                if (admin === "محمد رضا") color = '#ff6b6b';
                html += `<span style="display:inline-flex;align-items:center;gap:6px;margin-left:8px;color:${color};">`;
                html += admin;
                if (isSuperAdmin && admin !== "ابوالفضل" && admin !== "محمد رضا") {
                    html += ` <button class="remove-admin-btn" onclick="removeAdmin('${admin}')">❌</button>`;
                }
                html += `</span>`;
            });
            adminListEl.innerHTML = html;
        }

        // ==========================================================
        //  تولید آیدی تصادفی
        // ==========================================================
        function generateRandomId() {
            const chars = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let result = 'Rw';
            for (let i = 0; i < 12; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // ==========================================================
        //  سیستم سوپر ادمین موقت
        // ==========================================================
        function isTemporarySuperAdmin(username) {
            const users = getUsersData();
            const userData = users[username];
            if (!userData) return false;
            const expiry = userData.superAdminExpiry;
            if (!expiry) return false;
            return expiry > Date.now();
        }

        function getSuperAdminRemainingDays(username) {
            const users = getUsersData();
            const userData = users[username];
            if (!userData || !userData.superAdminExpiry) return null;
            const remaining = userData.superAdminExpiry - Date.now();
            if (remaining <= 0) return null;
            const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
            const hours = Math.floor((remaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            return `${days} روز و ${hours} ساعت`;
        }

        // ==========================================================
        //  خرید سوپر ادمین
        // ==========================================================
        function buySuperAdmin() {
            const username = document.getElementById('displayUsername').textContent.trim();
            if (!username) { alert('لطفاً وارد شوید.'); return; }

            const coins = getUserCoins(username);
            if (coins < 200) {
                alert('❌ سکه کافی نیست! شما به ۲۰۰ سکه نیاز دارید.');
                return;
            }

            if (confirm('آیا مطمئن هستید که ۲۰۰ سکه برای خرید ۱ ماه سوپر ادمین خرج کنید؟')) {
                if (removeUserCoins(username, 200)) {
                    const users = getUsersData();
                    const newExpiry = Date.now() + 30 * 24 * 60 * 60 * 1000;
                    users[username].superAdminExpiry = newExpiry;
                    setUsersData(users);
                    alert('✅ تبریک! دسترسی سوپر ادمین به مدت ۱ ماه برای شما فعال شد.');
                    updateStoreUI();
                    updateCoinDisplay();
                } else {
                    alert('❌ خطا در کاهش سکه.');
                }
            }
        }

        // ==========================================================
        //  مدیریت پروفایل
        // ==========================================================
        function getProfileAvatar() {
            try { return localStorage.getItem('profileAvatar') || ''; } catch { return ''; }
        }

        function setProfileAvatar(dataUrl) {
            localStorage.setItem('profileAvatar', dataUrl);
            updateAvatarUI(dataUrl);
        }

        function updateAvatarUI(dataUrl) {
            const preview = document.getElementById('avatarPreview');

        function addAdminById() {
            const input = document.getElementById('addAdminIdInput');
            const accountId = input.value.trim();
            const msg = document.getElementById('addAdminMsg');

            if (!accountId) {
                msg.className = 'add-msg error';
                msg.textContent = '⚠️ لطفاً آیدی را وارد کنید.';
                return;
            }

            const username = getUsernameByAccountId(accountId);
            if (!username) {
                msg.className = 'add-msg error';
                msg.textContent = '❌ کاربری با این آیدی پیدا نشد.';
                return;
            }

            const admins = getAdmins();
            if (admins.includes(username)) {
                msg.className = 'add-msg error';
                msg.textContent = `⚠️ کاربر "${username}" قبلاً ادمین است.`;
                return;
            }

            admins.push(username);
            setAdmins(admins);
            updateAdminPanelUI();
            msg.className = 'add-msg success';
            msg.textContent = `✅ کاربر "${username}" با آیدی ${accountId} به لیست ادمین‌ها اضافه شد.`;
            input.value = '';
        }

        // ==========================================================

        // ==========================================================
        let selectedAge = null;

        function renderAgeGrid() {
            const grid = document.getElementById('ageGrid');
            if (!grid) return;
            grid.innerHTML = '';
            for (let i = 1; i <= 30; i++) {
                const btn = document.createElement('button');
                btn.className = 'age-btn';
                btn.dataset.age = i;
                btn.textContent = i;
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.age-btn').forEach(b => b.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedAge = i;
                    document.getElementById('selectedAgeDisplay').textContent = i;
                });
                grid.appendChild(btn);
            }
        }

        function confirmAge() {
            if (selectedAge === null) {
                alert('⚠️ لطفاً یک سن را انتخاب کنید.');
                return;
            }
            setUserAge(selectedAge);
            loadProfile();
            alert(`✅ سن ${selectedAge} سال ثبت شد!`);
            goHome();
        }

        // ==========================================================
        //  ساخت رمز عبور
        // ==========================================================
        function createPassword() {
            const input = document.getElementById('newPasswordInput');
            const password = input.value.trim();
            const status = document.getElementById('createPassStatus');

            if (!password) {
                status.className = 'status-msg error';
                status.textContent = '⚠️ لطفاً یک رمز عبور وارد کنید.';
                return;
            }
            if (password.length < 4) {
                status.className = 'status-msg error';
                status.textContent = '⚠️ رمز عبور باید حداقل ۴ کاراکتر باشد.';
                return;
            }

            const username = document.getElementById('displayUsername').textContent.trim();
            const existingId = getUserAccountId(username);
            const existingCoins = getUserCoins(username);
            const existingExpiry = getUsersData()[username]?.superAdminExpiry || null;
            const existingTrophies = getTrophies(username);
            const existingSpecial = isSpecialAccount(username);
            const existingStreak = getCurrentWinStreak(username);
            if (existingId) {
                setUserData(username, password, existingId, existingCoins, existingExpiry, existingTrophies, existingSpecial,
                    existingStreak);
            } else {
                const newId = generateRandomId();
                setUserData(username, password, newId, 0, null, 0, false, 0);
            }
            loadProfile();
            status.className = 'status-msg success';
            status.textContent = '✅ رمز عبور با موفقیت ذخیره شد!';
            updateCreatePassButton(password);
            setTimeout(() => { goHome(); }, 1500);
        }

        // ==========================================================
        //  ورود با اکانت
        // ==========================================================
        function loginWithAccount() {
            const usernameInput = document.getElementById('loginUsernameInput');
            const passwordInput = document.getElementById('loginPasswordInput');
            const status = document.getElementById('loginAccountStatus');

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                status.className = 'status-msg error';
                status.textContent = '⚠️ لطفاً نام کاربری و رمز عبور را وارد کنید.';
                return;
            }
            if (!isUsernameTaken(username)) {
                status.className = 'status-msg error';
                status.textContent = '❌ کاربری با این نام کاربری وجود ندارد.';
                return;
            }

            if (isUserBanned(username)) {
                status.className = 'status-msg error';
                status.textContent = '🚫 شما بن ۴۸ ساعته هستید!';
                return;
            }

            const correctPass = getUserPasswordByUsername(username);
            if (!correctPass || correctPass === '') {
                status.className = 'status-msg error';
                status.textContent = '❌ این کاربر رمز عبور ندارد. ابتدا رمز بسازید.';
                return;
            }

            if (password === correctPass) {
                status.className = 'status-msg success';
                status.textContent = '✅ ورود موفق! در حال انتقال...';
                localStorage.setItem('username', username);
                document.getElementById('displayUsername').textContent = username;
                loadProfile();
                setTimeout(() => {
                    document.getElementById('accountLoginPage').style.display = 'none';
                    document.getElementById('registerPage').style.display = 'none';
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                    document.getElementById('bannedPage').style.display = 'none';
                    document.querySelectorAll('.main-header .header-left button').forEach(btn => {
                        if (btn.id !== 'logoutBtn') btn.style.display = 'inline-block';
                    });
                    document.querySelector('.main-header .profile-btn').style.display = 'flex';
                    document.querySelector('.main-header .create-pass-btn').style.display = 'inline-block';
                    document.querySelector('.main-header .store-btn').style.display = 'inline-block';
                    document.querySelector('.main-header .age-btn').style.display = 'inline-block';
                    document.querySelector('.main-header .gift-btn').style.display = 'inline-block';
                    document.querySelector('.main-header .rank-btn').style.display = 'inline-block';
                    document.getElementById('logoutBtn').style.display = 'inline-block';
                    ensureAdminAccess();
                    showPage('homePage');
                }, 1200);
            } else {
                status.className = 'status-msg error';
                status.textContent = '❌ اشتباه است';
            }
        }

        function loadProfile() {

            const accountId = getUserAccountId(username);

        function renderBanList() {
            const container = document.getElementById('banList');
            if (!container) return;
            const searchInput = document.getElementById('banSearchInput');
            const searchTerm = searchInput ? searchInput.value.trim().toLowerCase() : '';
            const allUsers = getRegisteredUsernames();
            const currentUser = document.getElementById('displayUsername').textContent.trim();
            let filteredUsers = allUsers;
            if (searchTerm) { filteredUsers = allUsers.filter(u => u.toLowerCase().includes(searchTerm)); }
            const banned = getBannedUsers();
            filteredUsers.sort((a, b) => {
                const aBanned = !!banned[a];
                const bBanned = !!banned[b];
                if (aBanned && !bBanned) return -1;
                if (!aBanned && bBanned) return 1;
                return a.localeCompare(b);
            });
            if (filteredUsers.length === 0) {
                container.innerHTML = `<div class="ban-empty">هیچ کاربری یافت نشد</div>`;
                return;
            }
            let html = '';
            filteredUsers.forEach(username => {
                const isBanned = !!banned[username];
                const isCurrentUser = username === currentUser;
                const isSuperAdmin = username === "ابوالفضل" || username === "محمد رضا";
                const isHeadAdminUser = isHeadAdmin(username);
                let canBan = true;
                if (isCurrentUser) canBan = false;
                if (isSuperAdmin) canBan = false;
                if (isHeadAdminUser) canBan = false;
                if (currentUser !== "ابوالفضل" && !isTemporarySuperAdmin(currentUser) && !isHeadAdmin(currentUser)) canBan =
                    false;
                const remaining = isBanned ? getBanRemainingTime(username) : null;
                html += `
                    <div class="ban-item">
                        <div class="ban-user">
                            <span class="ban-flag">${isBanned?'🚫': isHeadAdminUser ? '👑' : '👤'}</span>
                            <span class="ban-name">${username} ${isHeadAdminUser ? '🌟' : ''}</span>
                            ${isBanned ? `<span style="font-size:11px;color:#ff6b6b;margin-right:8px;">(${remaining})</span>` : ''}
                        </div>
                        ${canBan ? `
                            <button class="ban-btn ${isBanned?'unban':''}" onclick="${isBanned?`unbanUserAction('${username}')`:`banUserAction('${username}')`}">
                                ${isBanned?'✅ آنبَن':'🚫 بن ۴۸ساعته'}
                            </button>
                        ` : `
                            <span style="font-size:11px;color:rgba(255,255,255,0.3);">غیرقابل بن</span>
                        `}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function shootRobot(index) {
            if (!shootingState.isGameActive) {
                document.getElementById('shootingStatus').textContent = '⚠️ ابتدا بازی را شروع کنید!';
                return;
            }

            const robot = shootingState.robots[index];

            const weapon = shootingState.weapons[shootingState.selectedWeapon];

            robot.element.dataset.alive = 'false';

            // افکت شلیک

            const effect = document.createElement('div');

            effect.textContent = '💥';
            effect.style.left = '50%';
            effect.style.top = '50%';
            effect.style.transform = 'translate(-50%, -50%)';
            cell.appendChild(effect);
            setTimeout(() => effect.remove(), 400);

            const trail = document.createElement('div');

            shootingState.kills++;

            const remaining = 9 - shootingState.kills;
            document.getElementById('shootingRemaining').textContent = remaining;

            if (shootingState.kills === 9) {
                // برنده شد!
                shootingState.isGameActive = false;
                if (shootingState.robotShootTimer) {
                    clearInterval(shootingState.robotShootTimer);
                    shootingState.robotShootTimer = null;

                document.getElementById('shootingStatus').innerHTML = '🎉 <span class="win">همه ربات‌ها را کشتید! +۵۰ سکه</span>';

        }

        // ربات‌ها به سمت کاربر شلیک می‌کنند
        function robotShoot() {
            if (!shootingState.isGameActive) return;
            const aliveRobots = shootingState.robots.filter(r => r.alive);
            if (aliveRobots.length === 0) return;

            // ۵۰٪ احتمال شلیک
            if (Math.random() < 0.5) return;

            const randomRobot = aliveRobots[Math.floor(Math.random() * aliveRobots.length)];
            const cell = randomRobot.element.parentElement;

            cell.appendChild(effect);

                    }
                }, 1000);
            }
        }

        // ==========================================================
        //  بازی دوز با ربات هوشمندتر (Minimax ساده)
        // ==========================================================
        function getSmartRobotMove(board) {
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = 'O';
                    if (checkWinner() === 'O') {
                        board[i] = '';
                        return i;
                    }
                    board[i] = '';
                }
            }
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = 'X';
                    if (checkWinner() === 'X') {
                        board[i] = '';
                        return i;
                    }
                    board[i] = '';
                }
            }
            const corners = [0, 2, 6, 8];
            const shuffledCorners = corners.sort(() => Math.random() - 0.5);
            for (let c of shuffledCorners) {
                if (board[c] === '') return c;
            }
            if (board[4] === '') return 4;
            const empty = board.reduce((acc, v, idx) => v === '' ? [...acc, idx] : acc, []);
            if (empty.length > 0) {
                return empty[Math.floor(Math.random() * empty.length)];
            }
            return -1;
        }

        const originalRobotMove = robotMove;
        robotMove = function() {
            if (gameOver) { isRobotTurn = false; return; }
            const move = getSmartRobotMove(board);
            if (move !== -1) {
                applyRobotMove(move);
            } else {
                isRobotTurn = false;
            }
        };

        function checkConnection() {
            return new Promise((resolve) => {
                if (!navigator.onLine) { resolve(false); return; }
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                fetch('https://httpbin.org/get', { method: 'HEAD', mode: 'no-cors', signal: controller.signal })
                    .then(() => { clearTimeout(timeoutId);
                        resolve(true); })
                    .catch(() => { clearTimeout(timeoutId);
                        resolve(false); });
            });
        }

        async function initConnection() {
            const loader = document.getElementById('loader');
            const errorPage = document.getElementById('errorPage');
            const mainContent = document.getElementById('mainContent');
            loader.style.display = 'flex';
            errorPage.style.display = 'none';
            mainContent.style.display = 'none';
            const isConnected = await checkConnection();
            if (isConnected) {
                loader.style.display = 'none';
                mainContent.style.display = 'block';
                showPage('homePage');
            } else {
                loader.style.display = 'none';
                errorPage.style.display = 'flex';
            }
        }

        const winPatterns = [
            [0, 1, 2],
            [3, 4, 5],

        function playWinSound() {
            try {
                const audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                const notes = [{ freq: 523, duration: 0.15 }, { freq: 659, duration: 0.15 }, { freq: 784,
                        duration: 0.15 }, { freq: 1047, duration: 0.25 }];
                notes.forEach((note, index) => {
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.value = note.freq;
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime + index * 0.12);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.12 + note
                        .duration);
                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + index * 0.12);
                    osc.stop(audioCtx.currentTime + index * 0.12 + note.duration);
                });
                setTimeout(() => {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.value = 1200;
                    gain2.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.start();
                    osc2.stop(audioCtx.currentTime + 0.5);
                }, 400);
            } catch (e) {}
        }

        function playLoseSound() {
            try {
                const audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                const notes = [{ freq: 500, duration: 0.3 }, { freq: 450, duration: 0.3 }, { freq: 400,
                    duration: 0.3 }, { freq: 350, duration: 0.5 }];
                notes.forEach((note, index) => {
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.value = note.freq;
                    gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime + index * 0.25);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.25 + note
                        .duration);
                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + index * 0.25);
                    osc.stop(audioCtx.currentTime + index * 0.25 + note.duration);
                });
            } catch (e) {}
        }

        function startTimer() {
            clearTimer();
            timeLeft = MAX_TIME;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 5) { timerDisplay.classList.add('warning'); } else { timerDisplay.classList.remove(

                if (timeLeft <= 0) {
                    clearTimer();
                    timerDisplay.classList.remove('warning');
                    if (!gameOver && !isRobotTurn && currentPlayer === 'X') {
                        statusMsg.textContent = '⏰ زمان شما تمام شد! نوبت ربات...';
                        currentPlayer = 'O';
                        isRobotTurn = true;
                        setTimeout(() => { if (!gameOver) robotMove(); }, 300);
                    } else if (!gameOver && isRobotTurn && currentPlayer === 'O') {
                        statusMsg.textContent = '⏰ زمان ربات تمام شد! نوبت شما...';
                        currentPlayer = 'X';
                        isRobotTurn = false;
                        startTimer();
                    }

            }, 1000);
        }

        function clearTimer() {
            if (timerInterval) { clearInterval(timerInterval);
                timerInterval = null; }
            timerDisplay.classList.remove('warning');
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            board.forEach((val, idx) => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (val) {
                    cell.classList.add('taken', val === 'X' ? 'x' : 'o');
                    cell.textContent = val;
                } else {
                    cell.dataset.index = idx;
                    cell.addEventListener('click', () => handleHumanMove(idx));
                }
                boardEl.appendChild(cell);
            });
        }

        function checkWinner() {
            for (let p of winPatterns) {
                const [a, b, c] = p;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) { return board[a]; }
            }
            if (board.every(v => v !== '')) return 'draw';
            return null;
        }

        function endGame(result) {
            gameOver = true;
            clearTimer();
            if (gameId) {
                let games = getActiveGames();
                games = games.filter(g => g !== gameId);
                localStorage.setItem('activeGames', JSON.stringify(games));
                gameId = null;
                updateAdminStats();
            }
            if (result === 'X') {
                playWinSound();
                statusMsg.textContent = '🎉 شما برنده شدید!';
                giveWinReward();
            } else if (result === 'O') {
                playLoseSound();
                statusMsg.textContent = '🤖 ربات برنده شد!';
                resetStreakOnLose();
            } else if (result === 'draw') {
                statusMsg.textContent = '🤝 مساوی!';
                resetStreakOnLose();
            }
            document.querySelectorAll('.cell:not(.taken)').forEach(c => c.classList.add('taken'));
        }

        function handleHumanMove(index) {
            if (gameOver || isRobotTurn || board[index] !== '' || currentPlayer !== 'X') return;
            board[index] = 'X';
            renderBoard();
            const winner = checkWinner();
            if (winner) { endGame(winner); return; }
            currentPlayer = 'O';
            isRobotTurn = true;
            statusMsg.textContent = '🤖 ربات در حال فکر...';
            clearTimer();
            setTimeout(() => { if (!gameOver) { robotMove(); } }, 500);
        }

        function robotMove() {
            if (gameOver) { isRobotTurn = false; return; }
            const move = getSmartRobotMove(board);
            if (move !== -1) {
                applyRobotMove(move);
            } else {
                isRobotTurn = false;
            }
        }

        function applyRobotMove(index) {
            board[index] = 'O';
            renderBoard();
            const winner = checkWinner();
            if (winner) { endGame(winner);
                isRobotTurn = false; return; }
            currentPlayer = 'X';
            isRobotTurn = false;
            statusMsg.textContent = 'نوبت شما (X)';
            resetTimer();
        }

        // ==========================================================

        function enableBallDrag() {
            const ball = document.getElementById('ball');
            const pitch = document.getElementById('pitch');
            disableBallDrag();
            ball.style.cursor = 'grab';
            pitch.style.cursor = 'grab';
            const onStart = (e) => {
                if (footballState.isGameOver || footballState.turn !== 'player' || !footballState.hasStarted) return;
                e.preventDefault();
                footballState.isDragging = true;
                const rect = pitch.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                footballState.dragStartX = clientX;
                footballState.dragStartY = clientY;
                ball.style.cursor = 'grabbing';
                pitch.style.cursor = 'grabbing';
                createArrow(clientX, clientY);
            };
            const onMove = (e) => {
                if (!footballState.isDragging || footballState.isGameOver || footballState.turn !== 'player') return;
                e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                updateArrow(clientX, clientY);
            };
            const onEnd = (e) => {
                if (!footballState.isDragging) return;
                footballState.isDragging = false;
                ball.style.cursor = 'grab';
                pitch.style.cursor = 'grab';
                removeArrow();
                const rect = pitch.getBoundingClientRect();
                const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
                const dx = (clientX - footballState.dragStartX) / rect.width * 100;
                const dy = (clientY - footballState.dragStartY) / rect.height * 100;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance > 2) {
                    const newX = Math.min(Math.max(footballState.ballX + dx * 1.2, 5), 95);
                    const newY = Math.min(Math.max(footballState.ballY + dy * 1.2, 5), 95);
                    footballState.ballX = newX;
                    footballState.ballY = newY;
                    const ballEl = document.getElementById('ball');
                    ballEl.style.left = newX + '%';
                    ballEl.style.top = newY + '%';
                    checkGoal();
                    if (!footballState.isGameOver && footballState.turn === 'player') {
                        footballState.turn = 'robot';
                        document.getElementById('turnText').textContent = '🤖 Robot Turn';
                        document.getElementById('turnText').style.color = '#f093fb';
                        document.getElementById('playerTeam').classList.remove('active');
                        document.getElementById('robotTeam').classList.add('active');
                        document.getElementById('footballStatus').textContent = '🤖 نوبت ربات...';
                        setTimeout(() => robotMoveBall(), 800);
                    }
                } else {
                    document.getElementById('footballStatus').textContent = '👆 بیشتر بکشید!';
                    setTimeout(() => {
                        if (!footballState.isGameOver) {
                            document.getElementById('footballStatus').textContent = '👆 توپ را بکشید';
                        }
                    }, 600);
                }
            };
            dragHandlers.onStart = onStart;
            dragHandlers.onMove = onMove;
            dragHandlers.onEnd = onEnd;
            ball.addEventListener('mousedown', onStart);
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            ball.addEventListener('touchstart', onStart, { passive: false });
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onEnd, { passive: false });
        }

        let arrowElement = null;
        let arrowStartX = 0;
        let arrowStartY = 0;

        function createArrow(clientX, clientY) {
            removeArrow();
            const pitch = document.getElementById('pitch');
            const rect = pitch.getBoundingClientRect();
            arrowElement = document.createElement('div');
            arrowElement.style.position = 'absolute';
            arrowElement.style.pointerEvents = 'none';
            arrowElement.style.zIndex = '6';
            arrowElement.style.fontSize = '28px';
            arrowElement.style.color = '#ffd700';
            arrowElement.style.textShadow = '0 0 20px rgba(255,215,0,0.4)';
            arrowElement.textContent = '➡️';
            arrowElement.style.transition = 'none';
            const ball = document.getElementById('ball');
            const ballRect = ball.getBoundingClientRect();
            const centerX = ballRect.left + ballRect.width / 2 - rect.left;
            const centerY = ballRect.top + ballRect.height / 2 - rect.top;
            arrowStartX = centerX;
            arrowStartY = centerY;
            arrowElement.style.left = (centerX) + 'px';
            arrowElement.style.top = (centerY) + 'px';
            pitch.appendChild(arrowElement);
        }

        function updateArrow(clientX, clientY) {
            if (!arrowElement) return;
            const pitch = document.getElementById('pitch');
            const rect = pitch.getBoundingClientRect();
            const dx = clientX - rect.left - arrowStartX;
            const dy = clientY - rect.top - arrowStartY;
            const angle = Math.atan2(dy, dx);
            const distance = Math.min(Math.sqrt(dx * dx + dy * dy), 80);
            arrowElement.style.transform = `rotate(${angle}rad)`;
            arrowElement.style.left = (arrowStartX + Math.cos(angle) * 10) + 'px';
            arrowElement.style.top = (arrowStartY + Math.sin(angle) * 10) + 'px';
            const scale = 0.6 + (distance / 80) * 0.6;
            arrowElement.style.fontSize = (18 + scale * 22) + 'px';
        }

        function removeArrow() {
            if (arrowElement && arrowElement.parentNode) {
                arrowElement.parentNode.removeChild(arrowElement);
                arrowElement = null;
            }
        }

        function disableBallDrag() {
            const ball = document.getElementById('ball');
            if (dragHandlers.onStart) {
                ball.removeEventListener('mousedown', dragHandlers.onStart);
                ball.removeEventListener('touchstart', dragHandlers.onStart);
            }
            if (dragHandlers.onMove) {
                document.removeEventListener('mousemove', dragHandlers.onMove);
                document.removeEventListener('touchmove', dragHandlers.onMove);
            }
            if (dragHandlers.onEnd) {
                document.removeEventListener('mouseup', dragHandlers.onEnd);
                document.removeEventListener('touchend', dragHandlers.onEnd);
            }
            ball.style.cursor = 'default';
            document.getElementById('pitch').style.cursor = 'default';
            footballState.isDragging = false;
            removeArrow();
        }

        function robotMoveBall() {
            if (footballState.isGameOver || footballState.turn !== 'robot') return;
            const status = document.getElementById('footballStatus');
            status.textContent = '🤖 ربات در حال حرکت...';
            const targetX = 5 + Math.random() * 15;
            const targetY = 20 + Math.random() * 60;
            let steps = 0;
            const maxSteps = 12 + Math.floor(Math.random() * 8);
            const moveInterval = setInterval(() => {
                if (footballState.isGameOver || steps >= maxSteps) {
                    clearInterval(moveInterval);
                    if (!footballState.isGameOver) {
                        footballState.turn = 'player';
                        document.getElementById('turnText').textContent = '🎯 Your Turn';
                        document.getElementById('turnText').style.color = '#ffd700';
                        document.getElementById('playerTeam').classList.add('active');
                        document.getElementById('robotTeam').classList.remove('active');
                        document.getElementById('footballStatus').textContent = '👆 نوبت شما! توپ را بکشید.';
                        enableBallDrag();
                    }
                    return;
                }
                const currentX = footballState.ballX;
                const currentY = footballState.ballY;
                const dx = (targetX - currentX) / (maxSteps - steps);
                const dy = (targetY - currentY) / (maxSteps - steps);
                footballState.ballX += dx;
                footballState.ballY += dy;
                const ballEl = document.getElementById('ball');
                ballEl.style.left = footballState.ballX + '%';
                ballEl.style.top = footballState.ballY + '%';
                steps++;
                checkGoal();
                if (footballState.isGameOver) {
                    clearInterval(moveInterval);
                }
            }, 120);
        }

        function checkGoal() {
            if (footballState.isGameOver) return;
            const x = footballState.ballX;
            const y = footballState.ballY;
            const goalThreshold = 10;
            const goalYRange = { min: 30, max: 70 };
            if ((x < goalThreshold || x > 100 - goalThreshold) && y > goalYRange.min && y < goalYRange.max) {
                footballState.isGameOver = true;
                footballState.isGoal = true;
                disableBallDrag();
                const isPlayerGoal = x < goalThreshold;
                if (isPlayerGoal) { footballState.playerScore++; } else { footballState.robotScore++; }
                updateScoreDisplay();
                const goalMsg = document.getElementById('goalMessage');
                const goalText = document.getElementById('goalText');
                const goalSub = document.getElementById('goalSub');
                const scorer = isPlayerGoal ? footballState.playerCountry : footballState.robotCountry;
                goalText.textContent = isPlayerGoal ? `🎉 گل! ${scorer.flag}` : `😅 گل خوردی! ${scorer.flag}`;
                goalSub.textContent = isPlayerGoal ? 'تبریک! شما گل زدید!' : 'ربات گل زد!';
                goalMsg.style.display = 'block';
                const status = document.getElementById('footballStatus');
                if (isPlayerGoal) {
                    status.textContent = '🎉 شما گل زدید!';
                    document.getElementById('turnText').textContent = '✅ شما';
                    document.getElementById('turnText').style.color = '#2ecc71';
                    playWinSound();
                } else {
                    status.textContent = '😅 ربات گل زد!';
                    document.getElementById('turnText').textContent = '❌ ربات';
                    document.getElementById('turnText').style.color = '#ff6b8a';
                    playLoseSound();
                }
                if (footballState.playerScore >= 3) {
                    setTimeout(() => {
                        goalText.textContent = '🏆 شما برنده شدید!';
                        goalSub.textContent = `نتیجه نهایی ${footballState.playerScore} - ${footballState.robotScore}`;
                        goalMsg.style.display = 'block';
                        document.getElementById('footballStatus').textContent = '🏆 شما قهرمان شدید!';
                    }, 800);
                } else if (footballState.robotScore >= 3) {
                    setTimeout(() => {
                        goalText.textContent = '😔 ربات برنده شد!';
                        goalSub.textContent = `نتیجه نهایی ${footballState.playerScore} - ${footballState.robotScore}`;
                        goalMsg.style.display = 'block';
                        document.getElementById('footballStatus').textContent = '😔 ربات قهرمان شد!';
                    }, 800);
                }
                disableBallDrag();
            }
        }

        function resetFootballGame() {
            document.getElementById('goalMessage').style.display = 'none';
            footballState.isGameOver = false;
            footballState.isGoal = false;
            footballState.ballX = 50;
            footballState.ballY = 50;
            footballState.hasStarted = false;
            footballState.playerScore = 0;
            footballState.robotScore = 0;
            updateScoreDisplay();
            const ball = document.getElementById('ball');
            ball.style.left = '50%';
            ball.style.top = '50%';
            document.getElementById('footballStatus').textContent = '🔄 بازی جدید! کشور خود را انتخاب کنید';
            document.getElementById('turnText').textContent = '⏳ انتخاب کشور';
            document.getElementById('playerTeam').classList.remove('active');
            document.getElementById('robotTeam').classList.remove('active');
            disableBallDrag();
            showPage('countrySelectPage');
            renderCountries();
        }

            footballState.isGameOver = false;

            footballState.isDragging = false;

            document.getElementById('createPassActionBtn').addEventListener('click', createPassword);
            document.getElementById('confirmAgeBtn').addEventListener('click', confirmAge);

            document.getElementById('loginPasswordInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') loginWithAccount();
            });
            document.getElementById('registerPasswordInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') registerAccount();
            });
            document.getElementById('newPasswordInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') createPassword();
            });
            document.getElementById('addAdminIdInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') addAdminById();
            });

            const saved = localStorage.getItem('username');
            if (saved && saved.trim() !== '') {
                if (isUserBanned(saved)) {
                    document.getElementById('accountLoginPage').style.display = 'none';
                    document.getElementById('registerPage').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'none';
                    document.getElementById('bannedPage').style.display = 'flex';
                    document.getElementById('displayUsername').textContent = saved;
                    updateBanTimer();
                    return;
                }
                document.getElementById('accountLoginPage').style.display = 'none';
                document.getElementById('registerPage').style.display = 'none';
                document.getElementById('loader').style.display = 'flex';
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                    document.getElementById('bannedPage').style.display = 'none';
                    document.getElementById('displayUsername').textContent = saved;
                    const existingId = getUserAccountId(saved);
                    if (!existingId) {
                        const newId = generateRandomId();
                        const pass = getUserPasswordByUsername(saved);
                        setUserData(saved, pass || '', newId, 0, null, 0, false, 0);
                    }
                    loadProfile();
                    ensureAdminAccess();
                    showPage('homePage');
                    updateAdminStats();
                    document.getElementById('adminBtn').style.display = 'inline-block';
                    if (isModerator(saved)) {
                        document.getElementById('moderatorBtn').style.display = 'inline-block';
                    }
                    updateButtonsVisibility();
                    document.querySelectorAll('.main-header .header-left button').forEach(btn => {
                        if (btn.id !== 'logoutBtn') btn.style.display = 'inline-block';
                    });
                    document.querySelector('.main-header .profile-btn').style.display = 'flex';
                    document.querySelector('.main-header .create-pass-btn').style.display = 'inline-block';
                    document.querySelector('.main-header .store-btn').style.display = 'inline-block';
                    document.querySelector('.main-header .age-btn').style.display = 'inline-block';
                    document.querySelector('.main-header .gift-btn').style.display = 'inline-block';
                    document.querySelector('.main-header .rank-btn').style.display = 'inline-block';
                    document.getElementById('logoutBtn').style.display = 'inline-block';
                }, 1200);
            } else {
                showAccountLoginPage();
            }
        });
