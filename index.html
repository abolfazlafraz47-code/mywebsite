<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سایت در دسترس نیست</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazir', 'Tahoma', sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            padding: 40px 30px;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }
        .icon {
            font-size: 80px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 18px;
            color: rgba(255,255,255,0.7);
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .status-box {
            display: inline-block;
            padding: 8px 24px;
            border-radius: 30px;
            background: rgba(255,215,0,0.12);
            border: 1px solid rgba(255,215,0,0.15);
            color: #ffd700;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .footer {
            margin-top: 24px;
            font-size: 13px;
            color: rgba(255,255,255,0.3);
        }
        .footer span {
            color: #f093fb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔧</div>
        <h1>سایت در دسترس نیست</h1>
        <p>
            در حال بروزرسانی و بهبود امکانات هستیم.<br />
            لطفاً کمی بعد دوباره امتحان کنید.
        </p>
        <div class="status-box">⏳ به‌زودی بازمی‌گردیم</div>
        <div class="footer">
            ❄️ <span>برفی</span> | نسخه ۳.۰
        </div>
    </div>
</body>
</html>
