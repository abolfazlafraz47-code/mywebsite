<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>❄️ برفی</title>

    <style>
        /* ===== تمام استایل‌های قبلی را اینجا قرار دهید (برای اختصار، فقط بخش‌های ضروری نوشته شده) ===== */
        /* شما باید تمام CSSای که در فایل قبلی داشتید را اینجا کپی کنید */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazir', 'Tahoma', 'Segoe UI', sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0b0e2a;
            overflow-x: hidden;
            position: relative;
        }
        /* ... بقیه استایل‌ها ... */
        /* برای اختصار، فقط بخش‌های مربوط به گفتباکس را می‌گذارم */
        .gift-box {
            padding: 32px 24px;
            width: 100%;
            text-align: center;
            position: relative;
        }
        .gift-box .back-btn {
            position: absolute;
            top: 14px;
            right: 16px;
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 5px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2;
            box-shadow: none;
        }
        .gift-box .back-btn:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
            transform: scale(1.05);
        }
        .gift-box h2 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        .gift-box p {
            color: rgba(255,255,255,0.4);
            font-size: 14px;
            margin-bottom: 16px;
        }
        .gift-box .gift-input-area {
            display: flex;
            gap: 10px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }
        .gift-box .gift-input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 14px;
            border: 2px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.04);
            color: #fff;
            font-size: 18px;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
            min-width: 120px;
            letter-spacing: 2px;
        }
        .gift-box .gift-input-area input:focus {
            border-color: rgba(255,215,0,0.3);
            box-shadow: 0 0 30px rgba(255,215,0,0.05);
        }
        .gift-box .gift-input-area input::placeholder {
            color: rgba(255,255,255,0.2);
        }
        .gift-box .gift-input-area .gift-submit-btn {
            background: linear-gradient(135deg, #ffd700, #f093fb);
            color: #1a1a3a;
            border: none;
            padding: 12px 28px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255,215,0,0.15);
            white-space: nowrap;
        }
        .gift-box .gift-input-area .gift-submit-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 32px rgba(255,215,0,0.25);
        }
        .gift-box .gift-result {
            margin-top: 20px;
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            display: none;
            width: 100%;
        }
        .gift-box .gift-result.success {
            display: block;
            background: rgba(46,204,113,0.1);
            border: 2px solid rgba(46,204,113,0.3);
            color: #2ecc71;
        }
        .gift-box .gift-result.error {
            display: block;
            background: rgba(255,107,107,0.1);
            border: 2px solid rgba(255,107,107,0.3);
            color: #ff6b6b;
        }
        .gift-box .gift-result .gift-prize {
            font-size: 16px;
            color: rgba(255,255,255,0.7);
            font-weight: 400;
            margin-top: 4px;
        }
        .gift-box .back-home-btn {
            margin-top: 20px;
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.6);
            box-shadow: none;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .gift-box .back-home-btn:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        /* ... بقیه استایل‌ها ... */
    </style>
</head>
<body>

    <!-- ===== پس‌زمینه و برف ===== -->
    <div class="bg-glow"></div>
    <div class="snowflakes" id="snowflakes"></div>

    <div class="page-container">

        <!-- ======== صفحات ورود و ثبت نام ======== -->
        <!-- (همان‌طور که در فایل قبلی بود) -->

        <!-- ======== محتوای اصلی ======== -->
        <div id="mainContent" style="display:none;">

            <!-- ===== هدر ===== -->
            <!-- (همان‌طور که بود) -->

            <!-- ===== صفحه کد هدیه ===== -->
            <div id="giftPage">
                <div class="gift-box">
                    <button type="button" class="back-btn" onclick="goHome()">↩ بازگشت</button>
                    <h2>🎁 کد هدیه</h2>
                    <p>کد هدیه خود را وارد کنید</p>
                    <div class="gift-input-area">
                        <input type="text" id="giftCodeInputUser" placeholder="کد هدیه را وارد کنید..." maxlength="20" />
                        <button type="button" class="gift-submit-btn" onclick="checkGiftCode()">📤 ثبت</button>
                    </div>
                    <div class="gift-result" id="giftResult">
                        <div id="giftResultText"></div>
                        <div class="gift-prize" id="giftResultPrize"></div>
                    </div>
                    <button type="button" class="back-home-btn" onclick="goHome()">🔙 بازگشت به صفحه اصلی</button>
                </div>
            </div>

            <!-- ===== سایر صفحات ===== -->
            <!-- (همان‌طور که بود) -->

        </div><!-- /mainContent -->
    </div><!-- /page-container -->

    <script>
        // ===== تولید برف =====
        (function createSnow() {
            const container = document.getElementById('snowflakes');
            const flakes = ['❄', '❅', '❆', '✦'];
            for (let i = 0; i < 45; i++) {
                const el = document.createElement('div');
                el.className = 'snowflake';
                el.textContent = flakes[Math.floor(Math.random() * flakes.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.fontSize = (12 + Math.random() * 18) + 'px';
                el.style.animationDuration = (12 + Math.random() * 18) + 's';
                el.style.animationDelay = (Math.random() * 20) + 's';
                el.style.opacity = 0.3 + Math.random() * 0.5;
                container.appendChild(el);
            }
        })();

        // ==========================================================
        //  توابع کمکی (همان‌هایی که در فایل قبلی بود)
        // ==========================================================
        // (همه‌ی توابع قبلی مانند getUsersData, setUsersData, getUserCoins, addUserCoins, ...)
        // برای اختصار، فقط توابع جدید را می‌نویسم، ولی شما باید کل توابع قبلی را داشته باشید.

        // ==========================================================
        //  سیستم کدهای هدیه استفاده‌شده
        // ==========================================================
        const USED_GIFT_CODES_KEY = 'usedGiftCodes';

        function getUsedGiftCodes() {
            try {
                const data = localStorage.getItem(USED_GIFT_CODES_KEY);
                return data ? JSON.parse(data) : {};
            } catch {
                return {};
            }
        }

        function setUsedGiftCodes(used) {
            localStorage.setItem(USED_GIFT_CODES_KEY, JSON.stringify(used));
        }

        function addUsedGiftCode(username, code) {
            const used = getUsedGiftCodes();
            if (!used[username]) {
                used[username] = [];
            }
            if (!used[username].includes(code)) {
                used[username].push(code);
                setUsedGiftCodes(used);
                return true;
            }
            return false;
        }

        function hasUsedGiftCode(username, code) {
            const used = getUsedGiftCodes();
            return used[username] && used[username].includes(code);
        }

        // ==========================================================
        //  تابع بررسی کد هدیه (بروزرسانی‌شده)
        // ==========================================================
        function checkGiftCode() {
            const input = document.getElementById('giftCodeInputUser');
            const code = input.value.trim();
            const result = document.getElementById('giftResult');
            const textEl = document.getElementById('giftResultText');
            const prizeEl = document.getElementById('giftResultPrize');
            const username = document.getElementById('displayUsername').textContent.trim();

            // ۱. اگر کاربر وارد نشده باشد
            if (!username || username === 'کاربر' || username === '---') {
                result.className = 'gift-result error';
                result.style.display = 'block';
                textEl.textContent = '⚠️ لطفاً ابتدا وارد اکانت خود شوید.';
                prizeEl.textContent = '';
                return;
            }

            // ۲. کد 877 همیشه خطا
            if (code === '877') {
                result.className = 'gift-result error';
                result.style.display = 'block';
                textEl.textContent = '❌ کد هدیه اشتباه است!';
                prizeEl.textContent = '';
                return;
            }

            // ۳. کد "برفی" – یکبار مصرف برای هر کاربر
            if (code === 'برفی') {
                if (hasUsedGiftCode(username, 'برفی')) {
                    result.className = 'gift-result error';
                    result.style.display = 'block';
                    textEl.textContent = '⚠️ کد هدیه را قبلاً استفاده کردید!';
                    prizeEl.textContent = '';
                    return;
                } else {
                    // اعطای ۳۰ سکه
                    addUserCoins(username, 30);
                    addUsedGiftCode(username, 'برفی');
                    updateCoinDisplay();
                    result.className = 'gift-result success';
                    result.style.display = 'block';
                    textEl.textContent = '🎉 کد هدیه با موفقیت اعمال شد!';
                    prizeEl.textContent = '🪙 +۳۰ سکه به حساب شما اضافه شد.';
                    return;
                }
            }

            // ۴. کد عمومی (تنظیم‌شده توسط ادمین) - مثل "1234"
            const correctCode = getCurrentGiftCode(); // از تنظیمات
            if (code === correctCode) {
                const prize = getCurrentGiftPrize();
                const prizeNumber = parseInt(prize.match(/\d+/)?.[0] || '0');
                if (prizeNumber > 0) {
                    addUserCoins(username, prizeNumber);
                    updateCoinDisplay();
                }
                result.className = 'gift-result success';
                result.style.display = 'block';
                textEl.textContent = '✅ کد هدیه درست است!';
                prizeEl.textContent = `🎁 جایزه شما: ${prize}`;
                return;
            }

            // ۵. کد ناشناخته
            result.className = 'gift-result error';
            result.style.display = 'block';
            textEl.textContent = '❌ کد هدیه اشتباه است!';
            prizeEl.textContent = '';
        }

        // ==========================================================
        //  توابع قبلی (برای جلوگیری از خطا، فقط نمونه‌هایی از توابع ضروری)
        //  شما باید کل توابع قبلی را داشته باشید.
        // ==========================================================

        // ===== توابع سکه (از قبل موجود) =====
        function getUsersData() {
            try { const data = localStorage.getItem('usersData'); return data ? JSON.parse(data) : {}; } catch { return {}; }
        }

        function setUsersData(users) {
            localStorage.setItem('usersData', JSON.stringify(users));
        }

        function getUserCoins(username) {
            const users = getUsersData();
            return users[username] ? users[username].coins || 0 : 0;
        }

        function setUserCoins(username, amount) {
            const users = getUsersData();
            if (users[username]) {
                users[username].coins = Math.max(0, amount);
                setUsersData(users);
                updateCoinDisplay();
            }
        }

        function addUserCoins(username, amount) {
            const current = getUserCoins(username);
            setUserCoins(username, current + amount);
        }

        function updateCoinDisplay() {
            const username = document.getElementById('displayUsername').textContent.trim();
            const coins = getUserCoins(username);
            document.getElementById('coinCount').textContent = coins;
            const profileCoins = document.getElementById('profileCoins');
            if (profileCoins) profileCoins.textContent = coins;
        }

        // ===== توابع تنظیمات کد هدیه (از قبل موجود) =====
        function getGiftSettings() {
            try { const data = localStorage.getItem('giftSettings'); return data ? JSON.parse(data) : { code: '1234',
                    prize: '۱۰۰ سکه طلا' }; } catch { return { code: '1234', prize: '۱۰۰ سکه طلا' }; }
        }

        function getCurrentGiftCode() { const s = getGiftSettings(); return s.code || '1234'; }

        function getCurrentGiftPrize() { const s = getGiftSettings(); return s.prize || '۱۰۰ سکه طلا'; }

        // ===== توابع نمایش صفحات =====
        function showGiftPage() {
            showPage('giftPage');
            const result = document.getElementById('giftResult');
            result.className = 'gift-result';
            result.style.display = 'none';
            document.getElementById('giftCodeInputUser').value = '';
        }

        function goHome() {
            // ... (همان‌طور که بود)
            showPage('homePage');
        }

        function showPage(pageId) {
            // ... (همان‌طور که بود)
        }

        // ==========================================================
        //  بارگذاری اولیه
        // ==========================================================
        window.addEventListener('load', function() {
            // ... (بقیه کدهای راه‌اندازی)
            // فقط برای نمونه، فرض می‌کنیم کاربر وارد شده
            const saved = localStorage.getItem('username');
            if (saved) {
                document.getElementById('displayUsername').textContent = saved;
                updateCoinDisplay();
            }
        });

        // ==========================================================
        //  بقیه توابع (بازی دوز، فوتبال، پنل‌ها، ...) باید از فایل قبلی کپی شوند
        // ==========================================================
        console.log('❄️ برفی - کد هدیه "برفی" یکبار مصرف با ۳۰ سکه فعال شد.');
    </script>

</body>
</html>
