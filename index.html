<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>⚡ NEXORA | Gaming Hub</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#050711;
    --panel:#0b1020;
    --panel2:#11182b;
    --line:#202b48;
    --cyan:#00eaff;
    --purple:#9b5cff;
    --pink:#ff3cac;
    --green:#00ff9d;
    --yellow:#ffd43b;
    --text:#f5f7ff;
    --muted:#8f9bb7;
    --danger:#ff4d67;
}

body{
    font-family:"Vazirmatn",Tahoma,sans-serif;
    background:
      radial-gradient(circle at 10% 10%,rgba(0,234,255,.09),transparent 30%),
      radial-gradient(circle at 90% 20%,rgba(155,92,255,.10),transparent 30%),
      radial-gradient(circle at 50% 100%,rgba(255,60,172,.06),transparent 30%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
    background-size:45px 45px;
    z-index:-1;
}

button{
    font-family:inherit;
    cursor:pointer;
    border:0;
}

a{
    color:inherit;
    text-decoration:none;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(20px);
    background:rgba(5,7,17,.82);
    border-bottom:1px solid rgba(0,234,255,.12);
}

.header-inner{
    max-width:1400px;
    margin:auto;
    padding:13px 20px;
    display:flex;
    align-items:center;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:22px;
    font-weight:900;
    white-space:nowrap;
    color:#fff;
    text-shadow:0 0 20px var(--cyan);
}

.logo-icon{
    width:43px;
    height:43px;
    border-radius:13px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,var(--cyan),var(--purple));
    box-shadow:0 0 25px rgba(0,234,255,.35);
}

.nav{
    display:flex;
    gap:7px;
    flex:1;
    overflow:auto;
}

.nav button{
    background:transparent;
    color:var(--muted);
    padding:10px 13px;
    border-radius:11px;
    white-space:nowrap;
    transition:.2s;
}

.nav button:hover,
.nav button.active{
    color:#fff;
    background:rgba(0,234,255,.09);
    box-shadow:inset 0 -2px var(--cyan);
}

.header-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.currency{
    min-width:75px;
    padding:8px 11px;
    border-radius:12px;
    background:rgba(255,255,255,.045);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    font-size:13px;
}

.currency.coins{
    color:var(--yellow);
}

.currency.diamonds{
    color:#61e9ff;
}

.profile-btn{
    padding:8px 12px;
    border-radius:12px;
    color:white;
    background:linear-gradient(135deg,rgba(0,234,255,.14),rgba(155,92,255,.14));
    border:1px solid rgba(0,234,255,.25);
    display:flex;
    align-items:center;
    gap:7px;
    font-weight:700;
    transition:.2s;
}

.profile-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 0 20px rgba(0,234,255,.18);
}

/* MAIN */

main{
    max-width:1400px;
    margin:auto;
    padding:25px 20px 80px;
}

.hero{
    position:relative;
    min-height:430px;
    border:1px solid var(--line);
    border-radius:30px;
    overflow:hidden;
    background:
      radial-gradient(circle at 80% 20%,rgba(0,234,255,.18),transparent 28%),
      radial-gradient(circle at 20% 70%,rgba(155,92,255,.16),transparent 30%),
      linear-gradient(135deg,#090e1d,#080b16);
    display:flex;
    align-items:center;
    padding:55px;
    margin-bottom:25px;
}

.hero:after{
    content:"NEXORA";
    position:absolute;
    left:-30px;
    bottom:-80px;
    font-size:190px;
    font-weight:900;
    color:rgba(255,255,255,.018);
    pointer-events:none;
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:720px;
}

.badge{
    display:inline-flex;
    gap:8px;
    padding:8px 13px;
    border-radius:30px;
    color:var(--cyan);
    background:rgba(0,234,255,.08);
    border:1px solid rgba(0,234,255,.2);
    font-size:13px;
    margin-bottom:20px;
}

.hero h1{
    font-size:clamp(45px,8vw,90px);
    line-height:1;
    font-weight:900;
    letter-spacing:-4px;
    background:linear-gradient(90deg,#fff,var(--cyan),#b58cff);
    -webkit-background-clip:text;
    color:transparent;
    margin-bottom:18px;
}

.hero p{
    color:var(--muted);
    font-size:17px;
